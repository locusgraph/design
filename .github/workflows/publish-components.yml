name: publish-components

on:
  push:
    tags:
      - "components-v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          registry-url: https://registry.npmjs.org
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./packages/components/package.json').version")
          test "components-v$version" = "$GITHUB_REF_NAME" || { echo "tag $GITHUB_REF_NAME does not match version $version"; exit 1; }
      - run: pnpm --filter @locusgraph/components typecheck
      - run: pnpm --filter @locusgraph/components test
      - run: pnpm --filter @locusgraph/components publish --no-git-checks
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
